<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вопрос {{ question_num }} из 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; }
        .quiz-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); max-width: 650px; width: 100%; }
        .form-check { margin-bottom: 12px; padding: 14px 14px 14px 40px; border: 1px solid #dee2e6; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .form-check:hover { background-color: #f1f3f5; border-color: #007bff; }
        .btn-next { background-color: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; width: 100%; }
        pre { background: #212529; color: #f8f9fa; padding: 15px; border-radius: 8px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="quiz-card m-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-muted">Вопрос {{ question_num }} из 5</span>
            <span class="badge bg-secondary">Сложность: {{ question.difficulty }} / 25</span>
        </div>
        <h4 class="fw-bold text-dark mb-3">{{ question.text }}</h4>
        
        {% if question.code_snippet %}
        <pre><code>{{ question.code_snippet }}</code></pre>
        {% endif %}
        
        <form action="{% url 'submit' %}" method="POST" class="mt-4">
            {% csrf_token %}
            
            <div class="form-check">
                <input class="form-check-input" type="radio" name="answer" id="ans_A" value="A" required>
                <label class="form-check-label w-100" for="ans_A">{{ question.option_a }}</label>
            </div>
            
            <div class="form-check">
                <input class="form-check-input" type="radio" name="answer" id="ans_B" value="B" required>
                <label class="form-check-label w-100" for="ans_B">{{ question.option_b }}</label>
            </div>
            
            <div class="form-check">
                <input class="form-check-input" type="radio" name="answer" id="ans_C" value="C" required>
                <label class="form-check-label w-100" for="ans_C">{{ question.option_c }}</label>
            </div>

            <div class="form-check border-dashed border-secondary">
                <input class="form-check-input" type="radio" name="answer" id="ans_dont" value="dont_know" required>
                <label class="form-check-label w-100 text-muted fw-italic" for="ans_dont">
                    <em>🤷‍♂️ Затрудняюсь ответить / Не знаю</em>
                </label>
            </div>
            
            <button type="submit" class="btn btn-next mt-3">Отправить ответ</button>
        </form>
    </div>
</body>
</html>
